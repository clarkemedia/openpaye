server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No visitor logs: OpenPAYE keeps no record of who visits (errors are still logged)
  access_log off;

  # No cookies, no tracking, no third-party requests
  set $csp "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  error_page 404 /404.html;

  # Note: `expires` is used for caching because any add_header inside a
  # location would drop the security headers above.
  location /assets/ {
    expires 1y;
  }

  # The embeddable calculator may be framed by any site
  location = /embed.html {
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors *" always;
    add_header X-Content-Type-Options nosniff always;
    expires 1h;
  }

  # The widget script is loaded by other sites
  location = /widget.js {
    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ =404;
    expires 10m;
  }
}
