# Publishes the self-hosted build to the self-host branch on every push to source.
# Forks can serve that branch with GitHub Pages at https://<owner>.github.io/<repo>/
name: Deploy self-hosted build
on:
  push:
    branches: [source]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: self-host
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_DONATE_URL: https://www.paypal.com/paypalme/eoinmcm
      - name: Publish dist/ to the self-host branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b self-host
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" self-host
